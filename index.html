  <div class="app" id="app" data-screen="coin">
    <header class="hud">
      <div class="brand" id="brand" aria-label="Coinfolk">
        <span class="brand-mark">✦</span>
        <span>coinfolk<span class="brand-dot">.</span></span>
      </div>
      <div class="hud-balance">
        <span class="small-coin">✦</span>
        <div class="hud-balance-text">
          <strong id="hud-balance">0</strong>
          <span><span id="hud-rate">0</span> / sec</span>
        </div>
      </div>
      <div class="hud-right">
        <button class="ach-button book-button" data-action="open-handbook" aria-label="Handbook">

        </button>
        <button class="ach-button coll-button" data-action="open-collection" aria-label="Collection">
          <svg class="trophy" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.2 C3 5.9 5.5 3.5 8.6 3.5 h6.8 c3.1 0 5.6 2.4 5.6 5.7 Z" fill="currentColor"/><path d="M3 10.6 h7.4 v2.8 h3.2 v-2.8 H21 V19 a2 2 0 0 1 -2 2 H5 a2 2 0 0 1 -2 -2 Z" fill="currentColor"/></svg>

        </button>
        <button class="ach-button goals-button hud-go" data-go="goals" aria-label="Goals">

        <button class="diamond-pill" data-go="shop" aria-label="Diamonds, open the shop"><span>◆</span><strong id="hud-diamonds">0</strong></button>
        <button class="icon-button" data-action="open-settings" aria-label="Settings">⚙</button>
      </div>
    </header>

    <main class="screens">

        <div class="world-scene" id="world-scene" aria-hidden="true"></div>

          <div id="boost-offer"></div>
          <div class="eyebrow"><span class="eyebrow-dot"></span> <span id="world-label">WORLD 1 · THE MEADOW</span></div>
          <div class="balance-line"><span class="small-coin">✦</span><strong id="balance">0</strong></div>

          <div class="stats-row">
            <div><span class="stat-icon">↗</span><strong id="per-click">1</strong><span> / tap</span></div>
            <div><span class="stat-icon">◷</span><strong id="per-second">0</strong><span> / sec</span></div>
          </div>
          <div class="combo-meter hidden" id="combo-meter" aria-hidden="true">

            <div class="combo-track"><span class="combo-cover" id="combo-cover"></span></div>
            <b class="combo-mult" id="combo-mult">×1.00</b>
          </div>
        </div>
        <div class="boss-hud" id="boss-hud" aria-live="polite">

        <div class="coin-stage" id="coin-stage">

          <div class="orbit orbit-two"></div>
          <button class="scene-planet" id="scene-planet" data-action="open-globe" aria-label="Explore the planets"></button>

          <span class="sparkle sparkle-two">✧</span>
          <span class="sparkle sparkle-three">✦</span>
          <div class="coin-mover" id="coin-mover">
            <button id="coin-button" class="big-coin" aria-label="Tap to earn coins">
              <span class="coin-inner">
                <span id="coin-symbol">☘</span>
              </span>
              <span class="boss-figure" id="boss-figure" aria-hidden="true"></span>
            </button>
            <span class="boss-shield" aria-hidden="true"></span>
            <span class="boss-veil" aria-hidden="true"></span>
            <span class="boss-pond" aria-hidden="true"></span>
            <span class="boss-gate" aria-hidden="true"></span>
            <span class="bell-ring" id="bell-ring" aria-hidden="true"></span>
            <div class="boss-fx" id="boss-fx"></div>
            <span class="level-badge" id="level-badge">LV 1</span>

        <div id="boss-card"></div>
        <div class="golden-layer" id="golden-layer"></div>
        <div class="rain-layer" id="rain-layer"></div>

      <section class="screen" id="screen-upgrades" aria-label="Upgrades"><div id="upgrades-head"></div><div class="coll-tabs work-tabs" id="work-tabs" role="tablist"></div><div class="workshop-part" id="screen-machines"></div><div class="workshop-part" id="upgrades-part"></div></section>
      <section class="screen" id="screen-worlds" aria-label="Worlds"></section>

  <script>
    // The language: the one picked in Settings, or else the phone's own.
    (function () {
      var have = ['sv', 'de', 'es', 'fr', 'ru', 'uk', 'ja', 'zh'];
      var pick = 'auto';
      try { pick = localStorage.getItem('coinfolk-lang') || 'auto'; } catch (e) {}
      var code = pick === 'auto' ? 'en' : pick;
      if (pick === 'auto') {
        var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
        for (var i = 0; i < list.length; i++) {
          var tag = String(list[i]).toLowerCase();
          var base = tag.split('-')[0];
          // Traditional Chinese readers are better off with their next choice.
          if (base === 'zh' && /^zh-(hant|tw|hk|mo)/.test(tag)) continue;
          if (have.indexOf(base) >= 0 || base === 'en') { code = base; break; }
        }
      }
      if (have.indexOf(code) < 0) code = 'en';
      document.documentElement.lang = code === 'zh' ? 'zh-Hans' : code;
      if (code !== 'en') document.write('<script src="lang/' + code + '.js"><\/script>');
    })();
  </script>
